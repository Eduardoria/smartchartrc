plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apramed.smartchartrc'
    compileSdk 36

    defaultConfig {
        applicationId "com.apramed.smartchartrc"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sem dependências externas: usa apenas o SDK do Android.
